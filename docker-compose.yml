services:
  camera-health-monitor:
    build: .
    container_name: camera-health-monitor
    restart: unless-stopped
    environment:
      - FRIGATE_URL=http://frigate:5000
      - CAMERA_USER=${CAMERA_USER}
      - CAMERA_PASSWORD=${CAMERA_PASSWORD}
      - CHECK_INTERVAL=120
      - HA_URL=${HA_URL:-}
      - HA_TOKEN=${HA_TOKEN:-}
      # Route alerts through a specific HA service. Default notify/notify; set to
      # ticker/notify + a category to use the ticker (Frigate at home, Cabin at the cabin).
      - HA_NOTIFY_SERVICE=${HA_NOTIFY_SERVICE:-notify/notify}
      - HA_NOTIFY_CATEGORY=${HA_NOTIFY_CATEGORY:-}
      - REBOOT_THRESHOLD=3
      # Auto-restart Frigate (via its /api/restart) when the stats/recording engine wedges.
      # Guarded by a cooldown and a rolling 24h cap so it can't loop.
      - AUTO_RESTART_FROZEN=${AUTO_RESTART_FROZEN:-true}
      - RESTART_COOLDOWN=${RESTART_COOLDOWN:-900}
      - MAX_RESTARTS_PER_DAY=${MAX_RESTARTS_PER_DAY:-4}
      - INFLUXDB_URL=${INFLUXDB_URL:-}
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN:-}
      - INFLUXDB_ORG=${INFLUXDB_ORG:-smart_home}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:-frigate-health}
      # Wedged-camera detection: alert when a capture thread burst-reads a dead
      # restream (camera_fps/skipped_fps >= threshold for N cycles). Notify-only.
      - WEDGED_FPS_THRESHOLD=${WEDGED_FPS_THRESHOLD:-30}
      - WEDGED_CYCLES=${WEDGED_CYCLES:-2}
    # Must be able to reach Frigate API and camera IPs on 192.168.42.x
    # Option A: same network as Frigate
    # network_mode: "host"
    # Option B: join Frigate's docker network (update network name to match)
    networks:
      - frigate_default
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  frigate_default:
    external: true
